
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Static 2D Scene - WebGL</title>
  <style>
    body { 
      margin: 0; 
      background: #111; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    canvas { 
      border: 1px solid #333; 
      max-width: 100%;
      height: auto;
      display: block;
      image-rendering: auto;
      image-rendering: -webkit-optimize-contrast;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="glcanvas" width="1920" height="1080"></canvas>

  <script>
    const canvas = document.getElementById("glcanvas");
    const gl = canvas.getContext("webgl", { 
      antialias: true,
      preserveDrawingBuffer: true 
    });

    if (!gl) alert("WebGL not supported");
    
    // Set viewport to match canvas size
    gl.viewport(0, 0, canvas.width, canvas.height);

    // -------- Vertex Shader --------
    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, `
      attribute vec2 aPos;
      attribute vec3 aColor;
      varying vec3 vColor;
      void main() {
        gl_Position = vec4(aPos, 0.0, 1.0);
        vColor = aColor;
      }
    `);
    gl.compileShader(vs);

    // -------- Fragment Shader --------
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, `
      precision mediump float;
      varying vec3 vColor;
      void main() {
        gl_FragColor = vec4(vColor, 1.0);
      }
    `);
    gl.compileShader(fs);

    // Link program
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    // -------- Geometry: Sierpiński Triangle (Finite version with color per level) --------
    // This creates a Sierpiński triangle fractal using recursive subdivision
    // Format: x, y,   r, g, b
    
    // Recursive function to generate Sierpiński triangle
    function createSierpinskiTriangle(x1, y1, x2, y2, x3, y3, level, maxLevel, vertices) {
      if (level >= maxLevel) {
        // Base case: add triangle with color based on level
        let r, g, b;
        if (level === 0) {
          r = 1.0; g = 0.2; b = 0.2;  // Red
        } else if (level === 1) {
          r = 1.0; g = 1.0; b = 0.2;  // Yellow
        } else if (level === 2) {
          r = 0.2; g = 1.0; b = 0.2;  // Green
        } else if (level === 3) {
          r = 0.2; g = 1.0; b = 1.0;  // Cyan
        } else {
          r = 0.2; g = 0.4; b = 1.0;  // Blue
        }
        
        // Add triangle vertices with colors
        vertices.push(x1, y1, r, g, b);
        vertices.push(x2, y2, r, g, b);
        vertices.push(x3, y3, r, g, b);
        return;
      }
      
      // Recursive case: divide triangle into 3 smaller triangles
      const mx1 = (x1 + x2) / 2;
      const my1 = (y1 + y2) / 2;
      const mx2 = (x2 + x3) / 2;
      const my2 = (y2 + y3) / 2;
      const mx3 = (x3 + x1) / 2;
      const my3 = (y3 + y1) / 2;
      
      createSierpinskiTriangle(x1, y1, mx1, my1, mx3, my3, level + 1, maxLevel, vertices);
      createSierpinskiTriangle(mx1, my1, x2, y2, mx2, my2, level + 1, maxLevel, vertices);
      createSierpinskiTriangle(mx3, my3, mx2, my2, x3, y3, level + 1, maxLevel, vertices);
    }
    
    // Generate Sierpiński triangle with 3 levels (creates 13 triangles: 1 + 3 + 9)
    const vertices = [];
    const x1 = 0.0, y1 = 0.9;   // Top vertex
    const x2 = -0.8, y2 = -0.7;  // Bottom left
    const x3 = 0.8, y3 = -0.7;   // Bottom right
    
    createSierpinskiTriangle(x1, y1, x2, y2, x3, y3, 0, 3, vertices);
    
    const data = new Float32Array(vertices);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);

    const stride = 5 * 4;
    const aPos = gl.getAttribLocation(program, "aPos");
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(aPos);

    const aColor = gl.getAttribLocation(program, "aColor");
    gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, stride, 8);
    gl.enableVertexAttribArray(aColor);

    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    // Draw all triangles in a single drawArrays call
    // 13 triangles * 3 vertices = 39 vertices
    gl.drawArrays(gl.TRIANGLES, 0, vertices.length / 5);
    
    console.log("Sierpiński Triangle: " + (vertices.length / 15) + " triangles, " + (vertices.length / 5) + " vertices");

    // Make canvas responsive - scale to fit screen while maintaining aspect ratio
    function resizeCanvas() {
      const maxWidth = Math.min(window.innerWidth - 40, 1920);
      const aspectRatio = 1920 / 1080;
      const displayWidth = maxWidth;
      const displayHeight = maxWidth / aspectRatio;
      
      // Set CSS size for display
      canvas.style.width = displayWidth + 'px';
      canvas.style.height = displayHeight + 'px';
      
      // Ensure viewport matches actual canvas size (not CSS size)
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // PNG Export Function
    function saveImage() {
      const link = document.createElement('a');
      link.download = 'assignment1-part1-2d-scene.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    window.saveImage = saveImage;
  </script>
  <div style="text-align:center; margin-top:20px;">
    <button onclick="saveImage()" style="padding:10px 20px; background:#4caf50; color:white; border:none; border-radius:5px; cursor:pointer;">Save as PNG</button>
  </div>
  </div>
</body>
</html>
