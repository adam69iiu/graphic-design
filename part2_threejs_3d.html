
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Static 3D Scene - Three.js</title>
  <style>
    body { 
      margin: 0; 
      background: #ffffff; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    canvas { 
      display: block; 
      max-width: 100%;
      height: auto;
      image-rendering: auto;
      image-rendering: -webkit-optimize-contrast;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 100%;
    }
    .controls-panel {
      margin-top: 20px;
      padding: 20px;
      background: rgba(26, 21, 37, 0.9);
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 800px;
      width: 100%;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-group label {
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }
    .control-buttons {
      display: flex;
      gap: 5px;
    }
    .control-buttons button {
      flex: 1;
      padding: 8px 12px;
      background: #D67AD2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .control-buttons button:hover {
      background: #c569c0;
      transform: scale(1.05);
    }
    .control-buttons button:active {
      transform: scale(0.95);
    }
    .zoom-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .zoom-controls button {
      padding: 10px 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .zoom-controls button:hover {
      background: #45a049;
    }
    .info-display {
      color: #fff;
      font-size: 11px;
      margin-top: 5px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
<div class="container">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1A1525);

  const camera = new THREE.PerspectiveCamera(
    60,
    2560/1440,
    0.1,
    1000
  );
  camera.position.set(4, 2, 5);
  camera.lookAt(0, 0, 0);

  const canvas = document.createElement('canvas');
  canvas.width = 2560;
  canvas.height = 1440;
  const renderer = new THREE.WebGLRenderer({ 
    canvas: canvas,
    antialias: true,
    preserveDrawingBuffer: true,  // Required for PNG export
    powerPreference: "high-performance"
  });
  renderer.setSize(2560, 1440);
  // Don't use devicePixelRatio for display - it makes it too large
  // Keep internal resolution at 2560x1440, scale with CSS
  document.querySelector('.container').insertBefore(renderer.domElement, document.querySelector('.container').firstChild);
  
  // Make canvas responsive - scale to fit screen while maintaining aspect ratio
  function resizeCanvas() {
    const maxWidth = Math.min(window.innerWidth - 40, 2560);
    const aspectRatio = 2560 / 1440;
    const displayWidth = maxWidth;
    const displayHeight = maxWidth / aspectRatio;
    
    // Set CSS size for display (internal resolution stays 2560x1440)
    canvas.style.width = displayWidth + 'px';
    canvas.style.height = displayHeight + 'px';
  }
  
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
  const material = new THREE.MeshPhongMaterial({ color: 0xD67AD2 });
  const sphere = new THREE.Mesh(sphereGeo, material);
  sphere.position.set(0, 0.5, 0);  // Start position
  scene.add(sphere);
  
  // Store initial camera distance and position for zoom/reset
  let cameraDistance = 7;
  const initialCameraPos = { x: 4, y: 2, z: 5 };
  const initialCameraAngle = Math.atan2(initialCameraPos.x, initialCameraPos.z);

  const light = new THREE.DirectionalLight(0xFFF2E9, 1);
  light.position.set(5, 5, 5);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0x3C1F4A);
  scene.add(ambient);

  // Bonus: Ground Plane
  const groundGeo = new THREE.PlaneGeometry(15, 15);
  const groundMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, -1 ,0);
  scene.add(ground);

  // Initial render
  renderer.render(scene, camera);
  
  // Interactive controls
  function updateCamera() {
    // Maintain camera angle while adjusting distance
    camera.position.x = Math.sin(initialCameraAngle) * cameraDistance;
    camera.position.z = Math.cos(initialCameraAngle) * cameraDistance;
    camera.position.y = initialCameraPos.y;
    
    camera.lookAt(sphere.position);
    renderer.render(scene, camera);
    updateInfo();
  }
  
  function updateInfo() {
    const info = document.getElementById('position-info');
    if (info) {
      info.textContent = `Sphere: (${sphere.position.x.toFixed(1)}, ${sphere.position.y.toFixed(1)}, ${sphere.position.z.toFixed(1)}) | Camera Distance: ${cameraDistance.toFixed(1)}`;
    }
  }
  
  // Movement functions
  function moveX(delta) {
    sphere.position.x += delta;
    camera.lookAt(sphere.position);
    renderer.render(scene, camera);
    updateInfo();
  }
  
  function moveY(delta) {
    sphere.position.y += delta;
    camera.lookAt(sphere.position);
    renderer.render(scene, camera);
    updateInfo();
  }
  
  function moveZ(delta) {
    sphere.position.z += delta;
    camera.lookAt(sphere.position);
    renderer.render(scene, camera);
    updateInfo();
  }
  
  function zoom(delta) {
    cameraDistance = Math.max(2, Math.min(15, cameraDistance + delta));
    updateCamera();
  }
  
  function resetPosition() {
    sphere.position.set(0, 0.5, 0);
    cameraDistance = 7;
    camera.position.set(initialCameraPos.x, initialCameraPos.y, initialCameraPos.z);
    camera.lookAt(sphere.position);
    renderer.render(scene, camera);
    updateInfo();
  }

  // PNG Export Function
  function saveImage() {
    const link = document.createElement('a');
    link.download = 'assignment1-part2-3d-scene.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
  window.saveImage = saveImage;
  window.moveX = moveX;
  window.moveY = moveY;
  window.moveZ = moveZ;
  window.zoom = zoom;
  window.resetPosition = resetPosition;
</script>
<div class="controls-panel">
  <div class="control-group">
    <label>Move X-Axis (Left/Right)</label>
    <div class="control-buttons">
      <button onclick="moveX(-0.5)">← Left</button>
      <button onclick="moveX(0.5)">Right →</button>
    </div>
  </div>
  
  <div class="control-group">
    <label>Move Y-Axis (Up/Down)</label>
    <div class="control-buttons">
      <button onclick="moveY(0.5)">↑ Up</button>
      <button onclick="moveY(-0.5)">Down ↓</button>
    </div>
  </div>
  
  <div class="control-group">
    <label>Move Z-Axis (Forward/Back)</label>
    <div class="control-buttons">
      <button onclick="moveZ(-0.5)">← Forward</button>
      <button onclick="moveZ(0.5)">Back →</button>
    </div>
  </div>
  
  <div class="control-group">
    <label>Zoom Camera</label>
    <div class="zoom-controls">
      <button onclick="zoom(-1)">🔍 Zoom Out</button>
      <button onclick="zoom(1)">🔍 Zoom In</button>
    </div>
  </div>
  
  <div class="control-group" style="grid-column: 1 / -1;">
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button onclick="resetPosition()" style="padding:10px 20px; background:#ff6b6b; color:white; border:none; border-radius:5px; cursor:pointer;">🔄 Reset Position</button>
      <button onclick="saveImage()" style="padding:10px 20px; background:#4caf50; color:white; border:none; border-radius:5px; cursor:pointer;">💾 Save PNG</button>
    </div>
    <div id="position-info" class="info-display" style="text-align:center; margin-top:10px;">
      Sphere: (0.0, 0.5, 0.0) | Camera Distance: 7.0
    </div>
  </div>
</div>
</div>
</body>
</html>
